services:

  # =========================================================
  # Go API
  # =========================================================

  api:
    build: .

    ports:
      - "8080:8080"
    environment:
      APP_ENV: development
      APP_PORT: 8080
      APP_URL: http://localhost:8080

      DB_HOST: database
      DB_PORT: 5432
      DB_USER: postgres
      DB_PASS: admin
      DB_NAME: erp_repair_db
      DB_SSL: disable

      REDIS_HOST: redis
      REDIS_PORT: 6379
      REDIS_PASS: ""
      REDIS_DB: 0

      JWT_SECRET: change-me
      JWT_EXPIRES_IN: 24h
    env_file:
      - .env

    depends_on:
      database:
        condition: service_healthy
      redis:
        condition: service_healthy

    networks:
      - default
      - kafka-network

    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost:8080/health"]
      interval: 10s
      timeout: 3s
      retries: 5

    restart: unless-stopped


  # =========================================================
  # Redis
  # =========================================================

  redis:
    container_name: redis
    image: redis:8-alpine

    command: redis-server --appendonly yes

    ports:
      - "6379:6379"

    volumes:
      - redis_data:/data

    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 3s
      retries: 5

    restart: unless-stopped


  # =========================================================
  # PostgreSQL
  # =========================================================

  database:
    image: postgres:18-alpine
    ports:
    - "5433:5432"

    environment:
      POSTGRES_DB: erp_repair_db
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: admin

    volumes:
      - database_data:/var/lib/postgresql

    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d erp_repair_db"]
      interval: 10s
      timeout: 3s
      retries: 5

    restart: unless-stopped

  # =========================================================
  # KRaft Controllers
  # =========================================================

  controller-1:
    image: apache/kafka:3.7.0
    container_name: controller-1

    environment:
      KAFKA_NODE_ID: 1
      KAFKA_PROCESS_ROLES: controller

      KAFKA_LISTENERS: CONTROLLER://:9093
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER

      KAFKA_CONTROLLER_QUORUM_VOTERS: >-
        1@controller-1:9093,
        2@controller-2:9093,
        3@controller-3:9093

    volumes:
      - controller_1_data:/var/lib/kafka/data

    networks:
      - kafka-network


  controller-2:
    image: apache/kafka:3.7.0
    container_name: controller-2

    environment:
      KAFKA_NODE_ID: 2
      KAFKA_PROCESS_ROLES: controller

      KAFKA_LISTENERS: CONTROLLER://:9093
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER

      KAFKA_CONTROLLER_QUORUM_VOTERS: >-
        1@controller-1:9093,
        2@controller-2:9093,
        3@controller-3:9093

    volumes:
      - controller_2_data:/var/lib/kafka/data

    networks:
      - kafka-network


  controller-3:
    image: apache/kafka:3.7.0
    container_name: controller-3

    environment:
      KAFKA_NODE_ID: 3
      KAFKA_PROCESS_ROLES: controller

      KAFKA_LISTENERS: CONTROLLER://:9093
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER

      KAFKA_CONTROLLER_QUORUM_VOTERS: >-
        1@controller-1:9093,
        2@controller-2:9093,
        3@controller-3:9093

    volumes:
      - controller_3_data:/var/lib/kafka/data

    networks:
      - kafka-network


  # =========================================================
  # Kafka Brokers
  # =========================================================

  broker-1:
    image: apache/kafka:3.7.0
    container_name: broker-1

    ports:
      - "29092:9092"

    environment:
      KAFKA_NODE_ID: 4
      KAFKA_PROCESS_ROLES: broker

      KAFKA_LISTENERS: >-
        PLAINTEXT://:19092,
        PLAINTEXT_HOST://:9092

      KAFKA_ADVERTISED_LISTENERS: >-
        PLAINTEXT://broker-1:19092,
        PLAINTEXT_HOST://localhost:29092

      KAFKA_INTER_BROKER_LISTENER_NAME: PLAINTEXT

      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER

      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: >-
        CONTROLLER:PLAINTEXT,
        PLAINTEXT:PLAINTEXT,
        PLAINTEXT_HOST:PLAINTEXT

      KAFKA_CONTROLLER_QUORUM_VOTERS: >-
        1@controller-1:9093,
        2@controller-2:9093,
        3@controller-3:9093

      # -----------------------------------------------------
      # Reliability
      # -----------------------------------------------------

      KAFKA_DEFAULT_REPLICATION_FACTOR: 3
      KAFKA_MIN_INSYNC_REPLICAS: 2

      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 3

      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 3
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 2

      # -----------------------------------------------------
      # Topic
      # -----------------------------------------------------

      KAFKA_NUM_PARTITIONS: 3
      KAFKA_AUTO_CREATE_TOPICS_ENABLE: "false"

      # -----------------------------------------------------
      # Retention
      # -----------------------------------------------------

      KAFKA_LOG_RETENTION_HOURS: 168
      KAFKA_LOG_SEGMENT_BYTES: 1073741824

    volumes:
      - broker_1_data:/var/lib/kafka/data

    depends_on:
      - controller-1
      - controller-2
      - controller-3

    networks:
      - kafka-network


  broker-2:
    image: apache/kafka:3.7.0
    container_name: broker-2

    ports:
      - "39092:9092"

    environment:
      KAFKA_NODE_ID: 5
      KAFKA_PROCESS_ROLES: broker

      KAFKA_LISTENERS: >-
        PLAINTEXT://:19092,
        PLAINTEXT_HOST://:9092

      KAFKA_ADVERTISED_LISTENERS: >-
        PLAINTEXT://broker-2:19092,
        PLAINTEXT_HOST://localhost:39092

      KAFKA_INTER_BROKER_LISTENER_NAME: PLAINTEXT

      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER

      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: >-
        CONTROLLER:PLAINTEXT,
        PLAINTEXT:PLAINTEXT,
        PLAINTEXT_HOST:PLAINTEXT

      KAFKA_CONTROLLER_QUORUM_VOTERS: >-
        1@controller-1:9093,
        2@controller-2:9093,
        3@controller-3:9093

      # -----------------------------------------------------
      # Reliability
      # -----------------------------------------------------

      KAFKA_DEFAULT_REPLICATION_FACTOR: 3
      KAFKA_MIN_INSYNC_REPLICAS: 2

      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 3

      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 3
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 2

      # -----------------------------------------------------
      # Topic
      # -----------------------------------------------------

      KAFKA_NUM_PARTITIONS: 3
      KAFKA_AUTO_CREATE_TOPICS_ENABLE: "false"

      # -----------------------------------------------------
      # Retention
      # -----------------------------------------------------

      KAFKA_LOG_RETENTION_HOURS: 168
      KAFKA_LOG_SEGMENT_BYTES: 1073741824

    volumes:
      - broker_2_data:/var/lib/kafka/data

    depends_on:
      - controller-1
      - controller-2
      - controller-3

    networks:
      - kafka-network


  broker-3:
    image: apache/kafka:3.7.0
    container_name: broker-3

    ports:
      - "49092:9092"

    environment:
      KAFKA_NODE_ID: 6
      KAFKA_PROCESS_ROLES: broker

      KAFKA_LISTENERS: >-
        PLAINTEXT://:19092,
        PLAINTEXT_HOST://:9092

      KAFKA_ADVERTISED_LISTENERS: >-
        PLAINTEXT://broker-3:19092,
        PLAINTEXT_HOST://localhost:49092

      KAFKA_INTER_BROKER_LISTENER_NAME: PLAINTEXT

      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER

      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: >-
        CONTROLLER:PLAINTEXT,
        PLAINTEXT:PLAINTEXT,
        PLAINTEXT_HOST:PLAINTEXT

      KAFKA_CONTROLLER_QUORUM_VOTERS: >-
        1@controller-1:9093,
        2@controller-2:9093,
        3@controller-3:9093

      # -----------------------------------------------------
      # Reliability
      # -----------------------------------------------------

      KAFKA_DEFAULT_REPLICATION_FACTOR: 3
      KAFKA_MIN_INSYNC_REPLICAS: 2

      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 3

      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 3
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 2

      # -----------------------------------------------------
      # Topic
      # -----------------------------------------------------

      KAFKA_NUM_PARTITIONS: 3
      KAFKA_AUTO_CREATE_TOPICS_ENABLE: "false"

      # -----------------------------------------------------
      # Retention
      # -----------------------------------------------------

      KAFKA_LOG_RETENTION_HOURS: 168
      KAFKA_LOG_SEGMENT_BYTES: 1073741824

    volumes:
      - broker_3_data:/var/lib/kafka/data

    depends_on:
      - controller-1
      - controller-2
      - controller-3

    networks:
      - kafka-network


  # =========================================================
  # Kafka UI
  # =========================================================

  kafka-ui:
    image: provectuslabs/kafka-ui:latest
    container_name: kafka-ui

    ports:
      - "8090:8080"

    environment:
      KAFKA_CLUSTERS_0_NAME: kafka-prod-like

      KAFKA_CLUSTERS_0_BOOTSTRAPSERVERS: >-
        broker-1:19092,
        broker-2:19092,
        broker-3:19092

    depends_on:
      - broker-1
      - broker-2
      - broker-3

    networks:
      - kafka-network


# =========================================================
# Volumes
# =========================================================

volumes:
  database_data:
  redis_data:

  controller_1_data:
  controller_2_data:
  controller_3_data:

  broker_1_data:
  broker_2_data:
  broker_3_data:


# =========================================================
# Networks
# =========================================================

networks:
  kafka-network:
    driver: bridge